
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VI.B.E - Catálogo Digital</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <!-- React e Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        html { scroll-behavior: smooth; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes scaleUp {
            from { transform: scale(1.1); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-scale-up { animation: scaleUp 1.2s ease-out forwards; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
<body class="bg-stone-50 text-stone-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DADOS ---
        const CHURCH_DATA = {
            name: "VI.B.E",
            tagline: "Escondi a tua palavra no meu coração, para eu não pecar contra ti. Salmos 119:11",
            address: "Av. Principal, 1234, Centro",
            city: "São Paulo - SP",
            mainImageUrl: "https://image2url.com/r2/default/images/1770498710403-934e2b75-468f-43c5-be4d-520493810869.png",
            googleMapsUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.197582313654!2d-46.6521903!3d-23.5615097!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c8da173f47%3A0x650f51d597370335!2sAv.%20Paulista%2C%20S%C3%A3o%20Paulo%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1700000000000!5m2!1spt-BR!2sbr",
            socials: [
                { platform: 'Instagram', url: 'https://instagram.com', label: '@vibechurch' },
                { platform: 'YouTube', url: 'https://youtube.com', label: 'VI.B.E Channel' },
                { platform: 'Facebook', url: 'https://facebook.com', label: '/vibechurch' },
                { platform: 'WhatsApp', url: 'https://wa.me/5511999999999', label: 'Fale Conosco' },
            ],
            schedule: [
                { 
                  day: 'Segunda-feira', 
                  time: '19:30', 
                  activity: 'Culto de Mulheres', 
                  desc: 'Um tempo de comunhão e fortalecimento espiritual dedicado às mulheres.',
                  imageUrl: 'https://image2url.com/r2/default/images/1770501156929-33027d0f-184c-4e2a-956f-58da7923b28a.png'
                },
                { 
                  day: 'Quarta-feira', 
                  time: '19:30', 
                  activity: 'Culto', 
                  desc: 'Adoração e palavra no meio da semana.',
                  imageUrl: 'https://image2url.com/r2/default/images/1770501388084-e6df57e4-8b7f-427f-a4b4-ee1d94f5cb83.jpg'
                },
                { 
                  day: 'Quinta-feira', 
                  time: '19:30', 
                  activity: 'Reunião de jovens', 
                  desc: 'Conexão, propósito e fé para a nova geração.',
                  imageUrl: 'https://image2url.com/r2/default/images/1770501578936-866fb59a-82b6-4ef7-85c7-08b3de127c06.jpg'
                },
                { 
                  day: 'Sexta-feira', 
                  time: '19:30', 
                  activity: 'Reunião de homens', 
                  desc: 'Crescimento e comunhão masculina na presença de Deus.',
                  imageUrl: 'https://image2url.com/r2/default/images/1770501767308-2c2555b2-4809-45c7-8537-7e8bddd6dd25.jpg'
                },
                { 
                  day: 'Domingo', 
                  time: '19:00', 
                  activity: 'Culto de adoração', 
                  desc: 'Nossa celebração principal de gratidão e louvor.',
                  imageUrl: 'https://image2url.com/r2/default/images/1770501938584-bd5d9731-ca53-4e1e-82f8-b05cc8fdd3e9.jpg'
                },
            ]
        };

        // --- COMPONENTES ---

        const LandingPage = ({ onEnter }) => (
            <div className="fixed inset-0 z-[100] bg-stone-900 flex items-center justify-center p-6 overflow-hidden">
                <div className="absolute inset-0 z-0">
                    <img 
                        src={CHURCH_DATA.mainImageUrl} 
                        className="w-full h-full object-cover opacity-40 animate-scale-up"
                        alt="Background"
                    />
                    <div className="absolute inset-0 bg-gradient-to-b from-stone-900/40 via-stone-900/70 to-stone-900"></div>
                </div>

                <div className="relative z-10 text-center max-w-2xl animate-fade-in">
                    <h1 className="text-7xl md:text-9xl font-serif text-white mb-6 leading-tight tracking-tighter">
                        {CHURCH_DATA.name}
                    </h1>
                    
                    <p className="text-stone-300 text-lg md:text-xl mb-12 font-light italic max-w-md mx-auto">
                        "{CHURCH_DATA.tagline}"
                    </p>
                    
                    <div className="flex flex-col gap-4">
                        <button 
                            onClick={onEnter}
                            className="bg-amber-600 text-white px-12 py-5 rounded-2xl font-bold text-lg hover:bg-amber-500 transition-all shadow-2xl active:scale-95"
                        >
                            Acessar Catálogo
                        </button>
                    </div>
                </div>
                
                <div className="absolute bottom-10 text-stone-500 text-[10px] tracking-widest uppercase font-bold animate-pulse">
                    Toque para entrar
                </div>
            </div>
        );

        const Hero = ({ onShowSchedule }) => {
            const instagramUrl = CHURCH_DATA.socials.find(s => s.platform === 'Instagram')?.url || '#';
            const scrollToSection = (id) => {
              const el = document.getElementById(id);
              if (el) el.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <section className="relative min-h-[90vh] flex items-center justify-center overflow-hidden bg-stone-900 text-center px-4">
                    <div className="absolute inset-0 z-0">
                        <img 
                            src={CHURCH_DATA.mainImageUrl} 
                            className="w-full h-full object-cover opacity-50"
                            alt="Igreja"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-stone-900 via-stone-900/10 to-stone-900/60"></div>
                    </div>
                    <div className="relative z-10 max-w-4xl animate-fade-in">
                        <h1 className="text-7xl md:text-9xl font-serif text-white mb-8 leading-tight drop-shadow-2xl">
                            {CHURCH_DATA.name}
                        </h1>
                        <p className="text-xl md:text-2xl text-stone-200 font-light max-w-2xl mx-auto mb-12 leading-relaxed italic drop-shadow-md">
                            "{CHURCH_DATA.tagline}"
                        </p>
                        
                        <div className="flex flex-wrap gap-4 justify-center items-center">
                          <a 
                            href={instagramUrl} 
                            target="_blank" 
                            className="flex items-center gap-3 px-8 py-4 bg-gradient-to-tr from-[#f09433] via-[#dc2743] to-[#bc1888] rounded-2xl text-white font-bold transition-all shadow-xl hover:-translate-y-1"
                          >
                            <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24">
                              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                            </svg>
                            <span>Instagram</span>
                          </a>
                          <button 
                            onClick={() => scrollToSection('local')}
                            className="flex items-center gap-2 px-8 py-4 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl text-white font-bold hover:bg-white/20 transition-all shadow-xl"
                          >
                            📍 Localização
                          </button>
                          <button 
                            onClick={onShowSchedule}
                            className="flex items-center gap-2 px-8 py-4 bg-amber-600 rounded-2xl text-white font-bold hover:bg-amber-500 transition-all shadow-xl shadow-amber-900/20"
                          >
                            📅 Programação
                          </button>
                        </div>
                    </div>
                </section>
            );
        };

        const Schedule = () => (
            <section id="cronograma" className="py-24 px-4 bg-white">
                <div className="max-w-4xl mx-auto">
                    <div className="text-center mb-12">
                        <span className="text-amber-600 font-bold tracking-widest text-xs uppercase bg-amber-50 px-3 py-1 rounded-full">Cronograma</span>
                        <h2 className="text-4xl font-serif text-stone-800 mt-4">Nossa Programação</h2>
                    </div>
                    <div className="grid gap-8">
                        {CHURCH_DATA.schedule.map((item, i) => {
                            const isWomen = item.activity.toLowerCase().includes('mulheres');
                            const isWed = item.day === 'Quarta-feira';
                            const isThu = item.day === 'Quinta-feira';
                            const isFri = item.day === 'Sexta-feira';
                            const isSunMain = item.day === 'Domingo' && item.time === '19:00';
                            
                            let themeColor = 'amber';
                            if (isWomen) themeColor = 'rose';
                            if (isWed) themeColor = 'indigo';
                            if (isThu) themeColor = 'violet';
                            if (isFri) themeColor = 'emerald';
                            if (isSunMain) themeColor = 'gold';

                            const themeStyles = {
                              rose: { 
                                card: 'bg-rose-50/50 border-rose-100 hover:border-rose-300', 
                                day: 'text-rose-500', 
                                time: 'text-rose-900', 
                                tag: 'bg-rose-100 text-rose-700',
                                title: 'text-rose-800',
                                desc: 'text-rose-600/70',
                                border: 'border-rose-400'
                              },
                              indigo: { 
                                card: 'bg-indigo-50/50 border-indigo-100 hover:border-indigo-300', 
                                day: 'text-indigo-500', 
                                time: 'text-indigo-900', 
                                tag: 'bg-indigo-100 text-indigo-700',
                                title: 'text-indigo-800',
                                desc: 'text-indigo-600/70',
                                border: 'border-indigo-400'
                              },
                              violet: { 
                                card: 'bg-violet-50/50 border-violet-100 hover:border-violet-300', 
                                day: 'text-violet-500', 
                                time: 'text-violet-900', 
                                tag: 'bg-violet-100 text-violet-700',
                                title: 'text-violet-800',
                                desc: 'text-violet-600/70',
                                border: 'border-violet-400'
                              },
                              emerald: { 
                                card: 'bg-emerald-50/50 border-emerald-100 hover:border-emerald-300', 
                                day: 'text-emerald-500', 
                                time: 'text-emerald-900', 
                                tag: 'bg-emerald-100 text-emerald-700',
                                title: 'text-emerald-800',
                                desc: 'text-emerald-600/70',
                                border: 'border-emerald-400'
                              },
                              gold: { 
                                card: 'bg-amber-50 border-amber-200 hover:border-amber-400 shadow-xl shadow-amber-900/5', 
                                day: 'text-amber-700', 
                                time: 'text-amber-950', 
                                tag: 'bg-amber-200 text-amber-900',
                                title: 'text-amber-900',
                                desc: 'text-amber-800/80',
                                border: 'border-amber-600'
                              },
                              amber: { 
                                card: 'bg-stone-50 border-stone-100 hover:border-amber-200', 
                                day: 'text-amber-600', 
                                time: 'text-stone-800', 
                                tag: 'bg-white text-stone-400 border border-stone-100',
                                title: 'text-stone-800 group-hover:text-amber-600',
                                desc: 'text-stone-500',
                                border: 'border-amber-500'
                              }
                            }[themeColor];

                            return (
                                <div key={i} className={`flex flex-col md:flex-row items-stretch overflow-hidden border rounded-[2rem] transition-all group ${themeStyles.card}`}>
                                    {item.imageUrl && (
                                        <div className="md:w-1/3 h-64 md:h-auto overflow-hidden">
                                            <img src={item.imageUrl} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={item.activity} />
                                        </div>
                                    )}
                                    <div className={`p-8 flex-grow flex flex-col justify-center ${item.imageUrl ? 'md:w-2/3' : 'w-full'}`}>
                                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-4">
                                            <div className="flex flex-col">
                                                <p className={`font-bold text-xs uppercase tracking-widest ${themeStyles.day}`}>{item.day}</p>
                                                <p className={`text-4xl font-black ${themeStyles.time}`}>{item.time}</p>
                                            </div>
                                            <div className="mt-4 md:mt-0">
                                                <span className={`text-[10px] px-4 py-2 rounded-full font-bold uppercase tracking-wider ${themeStyles.tag}`}>Presencial</span>
                                            </div>
                                        </div>
                                        <div className={`border-l-4 pl-6 ${themeStyles.border}`}>
                                            <h3 className={`text-2xl font-bold transition-colors ${themeStyles.title}`}>{item.activity}</h3>
                                            <p className={`text-base mt-2 ${themeStyles.desc}`}>{item.desc}</p>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </section>
        );

        const Socials = () => (
            <section id="social" className="py-24 px-4 bg-stone-50">
                <div className="max-w-6xl mx-auto text-center">
                    <h2 className="text-4xl font-serif text-stone-800 mb-12">Conecte-se Conosco</h2>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                        {CHURCH_DATA.socials.map((s, i) => (
                            <a key={i} href={s.url} target="_blank" className="p-10 bg-white rounded-[2rem] border border-stone-100 hover:shadow-xl hover:-translate-y-1 transition-all group">
                                <p className="font-bold text-xl text-stone-800 group-hover:text-amber-600">{s.platform}</p>
                                <p className="text-xs text-stone-400 mt-2 font-medium uppercase tracking-wider">{s.label}</p>
                            </a>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Location = () => (
            <section id="local" className="py-24 px-4 bg-white">
                <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-16 items-center">
                    <div>
                        <h2 className="text-5xl font-serif text-stone-800 mb-8 text-center md:text-left">Localização</h2>
                        <p className="text-stone-500 text-lg mb-10 text-center md:text-left leading-relaxed">
                            {CHURCH_DATA.address}<br/>
                            {CHURCH_DATA.city}
                        </p>
                        <div className="text-center md:text-left">
                          <a 
                              href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CHURCH_DATA.address)}`} 
                              target="_blank"
                              className="inline-block bg-stone-900 text-white px-12 py-5 rounded-2xl font-bold hover:bg-stone-800 transition-all shadow-xl"
                          >
                              Como Chegar
                          </a>
                        </div>
                    </div>
                    <div className="h-96 rounded-[3rem] overflow-hidden border-8 border-white shadow-2xl relative">
                        <iframe src={CHURCH_DATA.googleMapsUrl} width="100%" height="100%" style={{ border: 0 }} loading="lazy"></iframe>
                    </div>
                </div>
            </section>
        );

        const App = () => {
            const [showCatalog, setShowCatalog] = useState(false);
            // Agora começa como false
            const [showSchedule, setShowSchedule] = useState(false);

            const handleShowSchedule = () => {
              setShowSchedule(true);
              setTimeout(() => {
                document.getElementById('cronograma')?.scrollIntoView({ behavior: 'smooth' });
              }, 50);
            };

            if (!showCatalog) {
                return <LandingPage onEnter={() => setShowCatalog(true)} />;
            }

            return (
                <div className="min-h-screen animate-fade-in bg-stone-50">
                    <Hero onShowSchedule={handleShowSchedule} />
                    {showSchedule && <Schedule />}
                    <Socials />
                    <Location />
                    <footer className="py-16 bg-stone-900 text-center">
                        <p className="font-serif text-3xl text-white mb-4 tracking-tighter">{CHURCH_DATA.name}</p>
                        <p className="text-stone-500 text-xs uppercase tracking-widest">&copy; {new Date().getFullYear()} - Todos os direitos reservados</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
